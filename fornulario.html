<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Crédito</title>
</head>
<body>

    <h1>Ingresa los datos del crédito</h1>

    <form action="#" method="post">

        <label for="monto">Monto del crédito:</label><br>
        <input type="number" id="monto" name="monto" required><br><br>

        <label for="interes">Interés mensual (%):</label><br>
        <input type="number" id="interes" name="interes" step="0.01" required><br><br>

        <label for="plazo">Plazo (meses):</label><br>
        <input type="number" id="plazo" name="plazo" required><br><br>

        <label for="fecha">Fecha de inicio:</label><br>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
